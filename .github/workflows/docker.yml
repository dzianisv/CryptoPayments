name: Build and push API image to GHCR

# Issue #6101: the self-hosted crypto-payments service runs from this image
# (ghcr.io/dzianisv/crypto-payments:<commit-sha>) on the control-plane k3s
# cluster. The AgentPod Deployment pins the exact SHA tag — no `latest` tag
# is published. The GHCR package must be PUBLIC: the cluster pulls the image
# anonymously (no imagePullSecrets on the Deployment).
#
# On pull requests the image is built but NOT pushed (proves the Dockerfile
# compiles on the PR without publishing an unreviewed tag).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/dzianisv/crypto-payments:${{ github.sha }}
