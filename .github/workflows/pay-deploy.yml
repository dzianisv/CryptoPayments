name: Deploy payment SPA to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build
        run: pnpm build
        working-directory: web
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}

      # Cloudflare Pages project "agentlabs-pay" serves pay.agentlabs.cc
      # (replaced Vercel, which was disabled with DEPLOYMENT_DISABLED on
      # 2026-11-27, and the Netlify lane, whose secrets were never set —
      # see VibeTechnologies/AgentPod#6435).
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        run: npx -y wrangler@4 pages deploy out --project-name agentlabs-pay --branch main --commit-dirty=true
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
