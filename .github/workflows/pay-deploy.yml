name: Deploy payment SPA to Netlify

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build
        run: pnpm build
        working-directory: web

      - name: Deploy to Netlify
        run: npx -y netlify-cli@latest deploy --dir=out --prod
        working-directory: web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
