# CryptoPayments — pnpm workspace settings (issue #6101).
#
# `packages: ['.']` keeps this a single-package workspace: pnpm 9 errors
# ("packages field missing or empty") on a pnpm-workspace.yaml with no
# `packages` key, and CI's build-and-test job still runs pnpm 9.
packages:
  - '.'

# allowBuilds is the pnpm 10+ home of the build-script allowlist (it
# replaces the `pnpm.onlyBuiltDependencies` field in package.json, which
# pnpm 12 no longer reads at all — the Docker image builds with corepack's
# default pnpm, currently 12.x, and fails the install with
# ERR_PNPM_IGNORED_BUILDS when any of these three is unreviewed).
# The package.json field is KEPT alongside this file: CI's build-and-test
# job still runs pnpm 9, which reads the field and does not know allowBuilds.
# Both lists name the same three packages — keep them in sync.
allowBuilds:
  bufferutil: true
  utf-8-validate: true
  esbuild: true
